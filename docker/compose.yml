name: thalya-modas

services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
      target: development
    container_name: thalya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thalya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thalya_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-thalya_modas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - thalya_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - thalya_network

networks:
  thalya_network:
    driver: bridge

volumes:
  thalya_postgres_data:
    driver: local
