name: store-flow

services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
      target: development
    container_name: storeflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-storeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storeflow_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-store_flow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - storeflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - storeflow_network

networks:
  storeflow_network:
    driver: bridge

volumes:
  storeflow_postgres_data:
    driver: local
