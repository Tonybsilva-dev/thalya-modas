services:
  app:
    build:
      context: ../..
      target: development
      dockerfile: apps/api/Dockerfile
    container_name: thalya-api-dev
    working_dir: /workspace/apps/api
    volumes:
      - ./src:/workspace/apps/api/src
      - ./prisma:/workspace/apps/api/prisma
    ports:
      - "${PORT:-3000}:3000"
    command: pnpm dev
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
