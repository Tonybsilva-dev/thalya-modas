name: Deploy API

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment that owns the deployment secrets and approvals
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: Immutable release tag, for example v1.2.3
        required: true
        type: string

concurrency:
  group: deploy-api-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY_IMAGE: ghcr.io/tonybsilva-dev/thalya-modas-api

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate immutable image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid image tag: $IMAGE_TAG"
            exit 1
          fi

  publish:
    name: Publish API image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prevent image tag replacement
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          inspect_log="$RUNNER_TEMP/ghcr-image-inspect.log"

          if docker buildx imagetools inspect \
            "$REGISTRY_IMAGE:$IMAGE_TAG" > "$inspect_log" 2>&1; then
            echo "The image tag $IMAGE_TAG already exists and cannot be replaced."
            exit 1
          fi

          if grep -Eiq "not found|manifest unknown|name unknown" "$inspect_log"; then
            echo "The image tag $IMAGE_TAG is available."
            exit 0
          fi

          echo "Could not verify whether the image tag exists in GHCR."
          cat "$inspect_log"
          exit 1

      - name: Build and publish runtime image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ inputs.image_tag }}
            ${{ env.REGISTRY_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  migrate:
    name: Apply database migrations
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: ${{ inputs.environment }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Require deployment database
        shell: bash
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "DATABASE_URL is not configured in the selected GitHub Environment."
            exit 1
          fi

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply pending migrations
        run: pnpm db:deploy

      - name: Record release summary
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        shell: bash
        run: |
          {
            echo "## API release ready"
            echo
            echo "- Environment: \`$DEPLOY_ENVIRONMENT\`"
            echo "- Image: \`$REGISTRY_IMAGE:$IMAGE_TAG\`"
            echo "- Digest: \`$IMAGE_DIGEST\`"
            echo "- Database migrations: applied"
          } >> "$GITHUB_STEP_SUMMARY"
